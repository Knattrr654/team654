@import url('https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:'Onest',sans-serif;
    background:#000;
    color:#fff;
}

/* ================= VIDEO ================= */

.video-background{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    object-fit:cover;
    object-position:center;
    z-index:0;
    opacity:1;
    pointer-events:none;
}

/* ================= OVERLAY ================= */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.4);
    z-index:1;
    opacity:1;
    transition:opacity .8s;
}

/* ================= ENTER ================= */

#enter-screen{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#000;
    z-index:9999;
    cursor:pointer;
    transition:opacity .5s ease;
}

.enter-text{
    font-size:1.2rem;
    animation:pulse 2s infinite;
}

@keyframes pulse{
    0%{opacity:.5;}
    50%{opacity:1;}
    100%{opacity:.5;}
}

/* ================= MAIN ================= */

.container{
    position:relative;
    z-index:2;

    width:100%;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;

    opacity:0;
    transform:scale(.95);

    transition:.8s cubic-bezier(.25,.46,.45,.94);
}

.container.visible{
    opacity:1;
    transform:scale(1);
}

/* ================= CARD ================= */

.profile-card{
    background:rgba(255,255,255,.05);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);

    border:1px solid rgba(255,255,255,.1);
    border-radius:20px;

    padding:2.5rem 3rem;

    display:flex;
    flex-direction:column;
    align-items:center;

    max-width:400px;
    width:90%;

    box-shadow:0 8px 32px rgba(0,0,0,.3);
}

.avatar{
    width:110px;
    height:110px;
    object-fit:cover;
    border-radius:50%;
    margin-bottom:1rem;

    border:2px solid rgba(255,255,255,.2);

    box-shadow:0 0 20px rgba(255,255,255,.15);
}

.username{
    font-size:1.5rem;
    margin:.5rem 0;
    text-shadow:0 0 10px rgba(255,255,255,.3);
}

.description{
    font-size:.95rem;
    color:#ccc;
    text-align:center;
    margin-bottom:1.5rem;
}

.views{
    display:flex;
    align-items:center;
    gap:.5rem;

    color:#aaa;
    font-size:.85rem;

    margin-bottom:1.5rem;
}

.views svg{
    width:16px;
    height:16px;
}

/* ================= SOCIALS ================= */

.social-links{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:1rem;
    width:100%;
}

.social-btn{
    width:45px;
    height:45px;

    display:flex;
    align-items:center;
    justify-content:center;

    text-decoration:none;
    color:#fff;

    background:rgba(255,255,255,.1);

    border-radius:12px;

    transition:.2s;

    box-shadow:0 4px 15px rgba(0,0,0,.2);
}

.social-btn:hover{
    transform:translateY(-2px);
    background:rgba(255,255,255,.2);
    box-shadow:0 0 15px rgba(255,255,255,.2);
}

.social-btn svg{
    width:22px;
    height:22px;
    fill:currentColor;
}

/* ================= VOLUME ================= */

.volume-control{
    position:fixed;
    left:20px;
    bottom:20px;

    z-index:100;

    display:flex;
    align-items:center;

    background:rgba(0,0,0,.45);
    backdrop-filter:blur(12px);

    border:1px solid rgba(255,255,255,.1);
    border-radius:999px;

    padding:10px;

    overflow:hidden;

    transition:.35s;
}

#volume-btn{
    width:38px;
    height:38px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:none;
    border:none;

    color:white;

    cursor:pointer;
}

#volume-btn svg{
    width:22px;
    height:22px;
}

#volume-slider{

    width:0;

    opacity:0;

    margin-left:0;

    transition:.35s;

    accent-color:white;
}

.volume-control:hover #volume-slider{

    width:120px;

    opacity:1;

    margin-left:12px;
}

/* ================= CURSOR ================= */

body{

    <script>
document.addEventListener("DOMContentLoaded", () => {

    const enterScreen = document.getElementById("enter-screen");
    const bgVideo = document.getElementById("bg-video");
    const bgAudio = document.getElementById("bg-audio");
    const songs = [
    {
        url:"https://r2.guns.lol/abfc39e1-c5db-43dd-9cdc-07ceae8c2e42.mp3",
        name:"Heroes (we could be) -> Alesso, Tove Lo"
    },
    {
        url:"https://r2.guns.lol/046f2ed2-b0c0-4d90-bfc2-1f291b76b8c0.mp3",
        name:"Close Eyes - Slowed + Reverb -> DVRST"
    },
    {
        url:"https://r2.guns.lol/927bffab-a085-4592-9265-457136b2a263.mp3",
        name:"Fata Morgana -> Nina Chuba (OsTEKKe Remix)"
    }
];

let lastSong = localStorage.getItem("lastSong");
let randomSong;

do {
    randomSong = songs[Math.floor(Math.random() * songs.length)];
} while (randomSong.url === lastSong && songs.length > 1);

localStorage.setItem("lastSong", randomSong.url);

bgAudio.src = randomSong.url;


// Song Name anzeigen
document.getElementById("song-name").textContent = randomSong.name;
    const overlay = document.getElementById("overlay");
    const mainContent = document.getElementById("main-content");

    const volumeSlider = document.getElementById("volume-slider");
    const volumeBtn = document.getElementById("volume-btn");
    const volumeIcon = document.getElementById("volume-icon");

    let lastVolume = 0.5;

    // Startlautstärke
    bgAudio.volume = lastVolume;
    volumeSlider.value = lastVolume * 100;

    // Lautsprecher-Symbol aktualisieren
    function updateIcon() {
        if (bgAudio.volume === 0) {
            volumeIcon.innerHTML = `
                <path fill="currentColor"
                d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45a3.4 3.4 0 0 0 .05-.63zM3 9v6h4l5 5V4L7 9H3z"/>
            `;
        } else {
            volumeIcon.innerHTML = `
                <path fill="currentColor"
                d="M3 9v6h4l5 5V4L7 9H3zM16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
            `;
        }
    }

    updateIcon();

    // Click to Enter
    enterScreen.addEventListener("click", () => {

        enterScreen.style.opacity = "0";

        bgVideo.play().catch(console.error);
        bgAudio.play().catch(console.error);

        setTimeout(() => {

            enterScreen.style.display = "none";

            overlay.style.opacity = "1";
            mainContent.classList.add("visible");

        }, 500);

    });

    // Lautstärkeregler
    volumeSlider.addEventListener("input", () => {

        const volume = volumeSlider.value / 100;

        bgAudio.volume = volume;

        if (volume > 0) {
            lastVolume = volume;
        }

        updateIcon();

    });

    // Klick auf Lautsprecher = Mute / Unmute
    volumeBtn.addEventListener("click", () => {

        if (bgAudio.volume > 0) {

            lastVolume = bgAudio.volume;
            bgAudio.volume = 0;
            volumeSlider.value = 0;

        } else {

            bgAudio.volume = lastVolume;
            volumeSlider.value = lastVolume * 100;

        }

        updateIcon();

    });

});
</script>
