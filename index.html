<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@Team 654</title>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:'Onest',sans-serif;
    background:#000;
    color:#fff;
}

/* ================= VIDEO ================= */

.video-background{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    object-fit:cover;
    object-position:center;
    z-index:0;
    opacity:1;
    pointer-events:none;
}

/* ================= OVERLAY ================= */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.4);
    z-index:1;
    opacity:1;
    transition:opacity .8s;
}

/* ================= ENTER ================= */

#enter-screen{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#000;
    z-index:9999;
    cursor:pointer;
    transition:opacity .5s ease;
}

.enter-text{
    font-size:1.2rem;
    animation:pulse 2s infinite;
}

@keyframes pulse{
    0%{opacity:.5;}
    50%{opacity:1;}
    100%{opacity:.5;}
}

/* ================= MAIN ================= */

.container{
    position:relative;
    z-index:2;

    width:100%;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;

    opacity:0;
    transform:scale(.95);

    transition:.8s cubic-bezier(.25,.46,.45,.94);
}

.container.visible{
    opacity:1;
    transform:scale(1);
}

/* ================= CARD ================= */

.profile-card{
    background:rgba(255,255,255,.05);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);

    border:1px solid rgba(255,255,255,.1);
    border-radius:20px;

    padding:2.5rem 3rem;

    display:flex;
    flex-direction:column;
    align-items:center;

    max-width:400px;
    width:90%;

    box-shadow:0 8px 32px rgba(0,0,0,.3);
}

.avatar{
    width:110px;
    height:110px;
    object-fit:cover;
    border-radius:50%;
    margin-bottom:1rem;

    border:2px solid rgba(255,255,255,.2);

    box-shadow:0 0 20px rgba(255,255,255,.15);
}

.username{
    font-size:1.5rem;
    margin:.5rem 0;
    text-shadow:0 0 10px rgba(255,255,255,.3);
}

.description{
    font-size:.95rem;
    color:#ccc;
    text-align:center;
    margin-bottom:1.5rem;
}

.views{
    display:flex;
    align-items:center;
    gap:.5rem;

    color:#aaa;
    font-size:.85rem;

    margin-bottom:1.5rem;
}

.views svg{
    width:16px;
    height:16px;
}

/* ================= SOCIALS ================= */

.social-links{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:1rem;
    width:100%;
}

.social-btn{
    width:45px;
    height:45px;

    display:flex;
    align-items:center;
    justify-content:center;

    text-decoration:none;
    color:#fff;

    background:rgba(255,255,255,.1);

    border-radius:12px;

    transition:.2s;

    box-shadow:0 4px 15px rgba(0,0,0,.2);
}

.social-btn:hover{
    transform:translateY(-2px);
    background:rgba(255,255,255,.2);
    box-shadow:0 0 15px rgba(255,255,255,.2);
}

.social-btn svg{
    width:22px;
    height:22px;
    fill:currentColor;
}

/* ================= VOLUME ================= */

.volume-control{
    position:fixed;
    bottom:20px;
    left:20px;

    z-index:100;

    width:40px;
    height:40px;

    display:flex;
    justify-content:center;
    align-items:center;

    border-radius:50%;

    background:rgba(0,0,0,.5);

    backdrop-filter:blur(5px);

    border:1px solid rgba(255,255,255,.1);

    cursor:pointer;

    transition:.2s;
}

.volume-control:hover{
    background:rgba(255,255,255,.1);
}

.volume-control svg{
    width:20px;
    height:20px;
    fill:#fff;
}

/* ================= CURSOR ================= */

body{
    cursor:url('https://r2.guns.lol/95e74d6c-101a-4bc2-834a-aab5cb66f2ca.png'),auto;
}

a,
.volume-control,
#enter-screen{
    cursor:url('https://r2.guns.lol/95e74d6c-101a-4bc2-834a-aab5cb66f2ca.png'),pointer;
}
 </style>

    <!-- Volume Control -->

     <button id="volume-btn">
        <svg id="volume-icon" viewBox="0 0 24 24">
            <path fill="currentColor"
                d="M3 9v6h4l5 5V4L7 9H3zM16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
        </svg>
     </button>

     <input
        id="volume-slider"
        type="range"
        min="0"
        max="100"
        value="50">
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const enterScreen = document.getElementById("enter-screen");
            const bgVideo = document.getElementById("bg-video");
            const bgAudio = document.getElementById("bg-audio");
            const overlay = document.getElementById("overlay");
            const mainContent = document.getElementById("main-content");
            const volBtn = document.getElementById("vol-btn");
            const volIcon = document.getElementById("vol-icon");

            // Define volume icons
            const iconVolumeOn = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
            const iconVolumeOff = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';

            // Handle entry click
            enterScreen.addEventListener("click", () => {
                // Fade out enter screen
                enterScreen.style.opacity = "0";
                
                // Start media playback
                bgVideo.play().catch(e => console.error("Video play failed:", e));
                bgAudio.play().catch(e => console.error("Audio play failed:", e));
                
                // Fade in content
                setTimeout(() => {
                    enterScreen.style.display = "none";
                    bgVideo.style.opacity = "1";
                    overlay.style.opacity = "1";
                    mainContent.classList.add("visible");
                }, 500);
            });

            // Handle volume toggle
            let isMuted = false;
            volBtn.addEventListener("click", () => {
                isMuted = !isMuted;
                bgAudio.muted = isMuted;
                bgVideo.muted = isMuted;
                
                if (isMuted) {
                    volIcon.innerHTML = iconVolumeOff;
                } else {
                    volIcon.innerHTML = iconVolumeOn;
                }
            });
        });
    </script>
